name: "Publish to CUE Registry"
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: "v0.17.0"
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.50.0"
      - name: Validate schema before publish
        run: |
          task vet-examples
          task test
      - name: Login to CUE Central Registry
        uses: cue-labs/registry-login-action@c7cf97db51448eaa8324e1ea4590deffa72df003 # v1.0.4
      - name: Publish module
        env:
          REF_NAME: ${{ github.ref_name }}
        run: cue mod publish "$REF_NAME"
