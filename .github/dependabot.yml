version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
      exclude: ["jflowers/*", "unbound-force/*", "zero-dot-force/*"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      # ship's workflows first, in their own PR, so a ship release isn't
      # held up by a third-party update in the same group.
      ship:
        patterns: ["jflowers/ship*"]
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
